# nginx site for the team display. Install (docs/SETUP.md):
#   sudo cp /srv/display/pi/nginx/display.conf /etc/nginx/sites-available/display
#   sudo ln -sf /etc/nginx/sites-available/display /etc/nginx/sites-enabled/display
#   sudo rm -f /etc/nginx/sites-enabled/default    # the default site listens on the network!
#   sudo nginx -t && sudo systemctl reload nginx
#
# It listens on 127.0.0.1 only: the kiosk browser on the Pi and `tailscale serve` are the
# only things that can reach it. Nothing on the campus network can.

server {
    listen 127.0.0.1:80 default_server;
    server_name _;
    server_tokens off;

    root /srv/display/web;
    index index.html;

    add_header X-Content-Type-Options nosniff always;

    # The page, its script and its styles: always check for a newer copy (after a
    # `git pull` the screen picks up the change on its next reload).
    location ~ ^/(|index\.html|app\.js|style\.css)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The JSON files the display re-reads every minute: never use a cached copy.
    location /data/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The admin pages: the Flask app under gunicorn.
    location /admin {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Set by `tailscale serve`: "https", and the Tailscale login of the person editing.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Tailscale-User-Login $http_tailscale_user_login;
        proxy_read_timeout 120s;  # a batch of photos takes a while on a Pi
    }
}
